<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تخته ارتباط با چشم</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#1d2330;--ac:#1f6feb;--ok:#14a44d;--bd:#d9d4c7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#1b2230;--tx:#f0f2f7;--ac:#5b9dff;--ok:#3ddc84;--bd:#2c364a}}
:root[data-theme="dark"]{--bg:#10141c;--card:#1b2230;--tx:#f0f2f7;--ac:#5b9dff;--ok:#3ddc84;--bd:#2c364a}
html,body{height:100%;margin:0;overflow:hidden}body{height:100dvh}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 12px}
header button,header select{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
header label{font-size:14px;display:flex;align-items:center;gap:6px}
#msg{flex:1;min-width:160px;text-align:center;font-size:clamp(22px,4vw,38px);font-weight:700;min-height:1.4em}
#grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:12px;padding:12px;min-height:0}
@media (max-width:700px){#grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr)}}
.tile{position:relative;background:var(--card);border:3px solid var(--bd);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;user-select:none;cursor:pointer}
.tile .e{font-size:clamp(48px,9vw,110px);line-height:1}
.tile .t{font-size:clamp(22px,3.4vw,44px);font-weight:700}
.tile::before{content:"";position:absolute;inset:0;background:var(--ok);opacity:.35;transform-origin:right;transform:scaleX(var(--p,0))}
.tile.hot{border-color:var(--ac)}
.tile.done{background:var(--ok);color:#fff}
#cal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;z-index:20;color:#fff}
#cal p{position:absolute;top:44%;left:10%;right:10%;text-align:center;font-size:22px;pointer-events:none}
.pt{position:absolute;width:44px;height:44px;margin:-22px;border-radius:50%;background:#e5372b;border:4px solid #fff;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pt.ok{background:#14a44d}
#dot{position:fixed;width:22px;height:22px;margin:-11px;border-radius:50%;background:rgba(229,55,43,.6);pointer-events:none;z-index:15;display:none}
#info{padding:0 14px 8px;font-size:13px;opacity:.75;text-align:center}
#cd{position:absolute;width:46px;height:46px;margin:-23px;border-radius:50%;background:#e5372b;border:5px solid #fff;transition:left .35s,top .35s}#vid{position:fixed;left:8px;bottom:8px;width:150px;border-radius:10px;transform:scaleX(-1);z-index:12;display:none;border:2px solid var(--bd)}@keyframes pu{50%{transform:scale(.55)}}#cd{animation:pu 1s infinite}
header{padding:6px 10px}header .b{font-size:15px}details summary{cursor:pointer;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);list-style:none}
.set{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:6px}
@media (max-width:700px){#msg{order:-1;flex-basis:100%;font-size:20px}#vid{width:84px}#grid{gap:8px;padding:8px}.tile{border-radius:16px}header{gap:6px}}
@media (max-height:520px){header{padding:3px 8px}#msg{font-size:18px}.tile .e{font-size:16vh}.tile .t{font-size:5vh}#info{display:none}}
</style>
</head>
<body>
<header>
  <button id="bStart" class="b">▶ شروع</button>
  <button id="bCal" class="b">🎯 کالیبراسیون</button>
  <button id="bQ" class="b">⊕ تصحیح سریع</button>
  <details><summary>⚙</summary><div class="set">
    <label>حالت <select id="mode"><option value="gaze">نگاه (دوربین)</option><option value="scan">اسکن خودکار</option><option value="ptr">ماوس/لمس</option></select></label>
    <label>زمان <input id="dw" type="range" min="1" max="4" step="0.25" value="1.75"><span id="dwv">1.75</span>ث</label>
    <button id="bTh">🌓</button></div></details>
  <div id="msg"></div>
</header>
<div id="grid"></div>
<div id="info">گوشی را ثابت (روی پایه) و روبه‌روی صورت بگذارید؛ بعد کالیبراسیون را بزنید.</div>
<div id="st" style="text-align:center;font-size:14px;padding:0 12px 8px"></div>
<div id="dot"></div>
<div id="cal"><p id="cp" style="top:20%;font-size:30px"></p><p>فقط به نقطهٔ قرمز نگاه کنید و سر را ثابت نگه دارید. نقطه خودش جابه‌جا می‌شود.</p><div id="cd"></div></div>
<video id="vid" playsinline muted></video>
<script type="module">
import {FaceLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";
var $=function(i){return document.getElementById(i)};
var ITEMS=[
 {e:"💧",t:"آب",s:"آب می‌خواهم"},{e:"🍲",t:"غذا",s:"گرسنه‌ام"},{e:"🚽",t:"دستشویی",s:"دستشویی لازم دارم"},{e:"😴",t:"خواب",s:"می‌خواهم بخوابم"},
 {e:"🤕",t:"درد",s:"درد دارم"},{e:"🔔",t:"کمک",s:"لطفاً کمک کنید، زود بیایید",alarm:true},{e:"🌡️",t:"سرما/گرما",s:"سردم است یا گرمم است"},{e:"👨‍👩‍👧",t:"خانواده",s:"می‌خواهم خانواده‌ام را ببینم"}];
var grid=$("grid"),msg=$("msg"),dot=$("dot"),st=$("st"),vid=$("vid"),tiles=[],cur=-1,since=0,lock=0,dwell=1.75,mode="gaze",scanI=0,scanT=0;
var lm=null,feat=null,W=null,collecting=null,S=[],lastT=-1,sx=null,sy=null,started=false;
ITEMS.forEach(function(it,i){var d=document.createElement("div");d.className="tile";
 d.innerHTML='<span class="e">'+it.e+'</span><span class="t">'+it.t+'</span>';
 d.onclick=function(){if(mode==="scan")choose(scanI)};grid.appendChild(d);tiles.push(d)});
function speak(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="fa-IR";
 var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.indexOf("fa")===0})[0];if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)(),n=0;
 var iv=setInterval(function(){var o=c.createOscillator(),g=c.createGain();o.frequency.value=n%2?880:660;g.gain.value=.4;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.25);if(++n>7)clearInterval(iv)},300)}catch(e){}}
function choose(i){var it=ITEMS[i];lock=performance.now()+2000;msg.textContent=it.e+" "+it.s;tiles[i].classList.add("done");
 setTimeout(function(){tiles[i].classList.remove("done")},1500);if(it.alarm)beep();speak(it.s);cur=-1;paint(0)}
function paint(p){tiles.forEach(function(t,i){t.style.setProperty("--p",i===cur?p:0);t.classList.toggle("hot",i===cur||(mode==="scan"&&i===scanI))})}
var pend=-2,pendT=0;
function hit(x,y,k){for(var i=0;i<tiles.length;i++){var r=tiles[i].getBoundingClientRect(),m=i===k?45:0;if(x>=r.left-m&&x<=r.right+m&&y>=r.top-m&&y<=r.bottom+m)return i}return -1}
function point(x,y){var now=performance.now();if(now<lock)return;var i=hit(x,y,cur);
 if(i!==cur){if(i!==pend){pend=i;pendT=now}if(cur<0||now-pendT>300){cur=i;since=now;pend=-2}}else pend=-2;
 if(cur>=0){var p=(now-since)/(dwell*1000);paint(Math.min(p,1));if(p>=1)choose(cur)}else paint(0)}
document.addEventListener("mousemove",function(e){if(mode==="ptr")point(e.clientX,e.clientY)});
document.addEventListener("touchmove",function(e){if(mode==="ptr"){var t=e.touches[0];point(t.clientX,t.clientY)}},{passive:true});
setInterval(function(){var n=performance.now();
 if(mode==="ptr"&&cur>=0&&n>=lock){var p=(n-since)/(dwell*1000);paint(Math.min(p,1));if(p>=1)choose(cur)}
 if(mode==="scan"&&n>scanT&&n>lock){scanI=(scanI+1)%ITEMS.length;scanT=n+dwell*1000;paint(0)}},100);
/* ---- gaze estimation from iris landmarks ---- */
var VW=640,VH=480,B={x:0,y:0},NF=10,rmsPx=0;
function eye(l,a,b,t,d,ir){var w=Math.hypot(l[b].x-l[a].x,l[b].y-l[a].y);
 return [(l[ir].x-(l[a].x+l[b].x)/2)/w,(l[ir].y-(l[t].y+l[d].y)/2)/w,Math.abs(l[d].y-l[t].y)/w]}
function feats(L){var l=L.map(function(p){return {x:p.x*VW,y:p.y*VH}});
 var a=eye(l,33,133,159,145,468),b=eye(l,362,263,386,374,473);
 if((a[2]+b[2])/2<.14)return false; /* blink */
 var fw=Math.hypot(l[454].x-l[234].x,l[454].y-l[234].y);
 var yaw=(l[1].x-(l[234].x+l[454].x)/2)/fw,pit=(l[1].y-(l[10].y+l[152].y)/2)/(l[152].y-l[10].y);
 return [(a[0]+b[0])/2,(a[1]+b[1])/2,yaw,pit,L[1].x,L[1].y]}
function row(f){var x=f[0],y=f[1];return [1,x,y,f[2],f[3],f[4],f[5],x*y,x*x,y*y]}
function solve(A,b){var n=b.length,M=A.map(function(r,i){return r.concat([b[i]])});
 for(var c=0;c<n;c++){var p=c;for(var r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;var t=M[c];M[c]=M[p];M[p]=t;
  for(var r2=c+1;r2<n;r2++){var f=M[r2][c]/M[c][c];for(var k=c;k<=n;k++)M[r2][k]-=f*M[c][k]}}
 var x=Array(n).fill(0);for(var i=n-1;i>=0;i--){var s=M[i][n];for(var j=i+1;j<n;j++)s-=M[i][j]*x[j];x[i]=s/M[i][i]}return x}
function dotp(a,b){var s=0;for(var i=0;i<a.length;i++)s+=a[i]*b[i];return s}
function fit1(S){var n=NF,A=[],bx=[],by=[];for(var i=0;i<n;i++){A.push(Array(n).fill(0));bx.push(0);by.push(0)}
 S.forEach(function(s){var r=s.r;for(var i=0;i<n;i++){for(var j=0;j<n;j++)A[i][j]+=r[i]*r[j];bx[i]+=r[i]*s.x;by[i]+=r[i]*s.y}});
 for(var i2=1;i2<n;i2++)A[i2][i2]+=2e-5*S.length;return {x:solve(A,bx),y:solve(A,by)}}
function errs(w,S){return S.map(function(s){var dx=(dotp(w.x,s.r)-s.x)*innerWidth,dy=(dotp(w.y,s.r)-s.y)*innerHeight;return Math.hypot(dx,dy)})}
function fit(S){S.forEach(function(s){s.r=row(s.f)});var w=fit1(S);
 for(var k=0;k<2;k++){var e=errs(w,S),rms=Math.sqrt(e.reduce(function(a,b){return a+b*b},0)/e.length);
  var keep=S.filter(function(s,i){return e[i]<=Math.max(1.8*rms,1)});if(keep.length<S.length*.6)break;S=keep;w=fit1(S)}
 var e2=errs(w,S);rmsPx=Math.sqrt(e2.reduce(function(a,b){return a+b*b},0)/e2.length);return w}
function onFrame(){
 if(collecting){if(collecting.q){if(feat&&W){var r0=row(feat);QS.push([dotp(W.x,r0),dotp(W.y,r0)])}return}
  if(feat)S.push({f:feat,x:collecting[0],y:collecting[1]});return}
 if(mode!=="gaze"||!W)return;
 if(!feat){point(-1,-1);return}
 var r=row(feat),x=(dotp(W.x,r)-B.x)*innerWidth,y=(dotp(W.y,r)-B.y)*innerHeight;
 x=Math.max(0,Math.min(innerWidth,x));y=Math.max(0,Math.min(innerHeight,y));
 if(sx===null){sx=x;sy=y}else{var d=Math.hypot(x-sx,y-sy),a=Math.min(.5,.06+d/400);sx+=(x-sx)*a;sy+=(y-sy)*a}
 dot.style.display="block";dot.style.left=sx+"px";dot.style.top=sy+"px";point(sx,sy)}
var QS=[];
function loop(){
 if(lm&&vid.readyState>=2&&vid.currentTime!==lastT){lastT=vid.currentTime;VW=vid.videoWidth||640;VH=vid.videoHeight||480;
  var r=lm.detectForVideo(vid,performance.now()),f=null,blink=false;
  if(r.faceLandmarks&&r.faceLandmarks[0]){f=feats(r.faceLandmarks[0]);if(f===false){blink=true;f=null}}
  if(!blink){feat=f;st.textContent=feat?(W?"✔ ردیابی فعال — خطای تقریبی "+Math.round(rmsPx)+" پیکسل":"✔ چهره دیده می‌شود؛ کالیبراسیون را بزنید"):"⚠ چهره دیده نمی‌شود";onFrame()}}
 requestAnimationFrame(loop)}
async function start(){
 if(started)return;started=true;msg.textContent="در حال بارگذاری مدل…";try{navigator.wakeLock&&navigator.wakeLock.request("screen")}catch(e){}
 try{
  var fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  lm=await FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:"GPU"},runningMode:"VIDEO",numFaces:1});
  vid.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:"user"}});
  vid.setAttribute("playsinline","");await vid.play();vid.style.display="block";msg.textContent="آماده است؛ کالیبراسیون را بزنید";loop()
 }catch(e){started=false;msg.textContent="خطا: "+(e&&e.message?e.message:e)+" (اینترنت و اجازهٔ دوربین را بررسی کنید)"}}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function calibrate(){
 if(!lm){msg.textContent="ابتدا «شروع» را بزنید";return}
 var pos=[[.5,.5],[.08,.14],[.5,.14],[.92,.14],[.92,.5],[.92,.88],[.5,.88],[.08,.88],[.08,.5],[.28,.3],[.72,.3],[.72,.7],[.28,.7]],cd=$("cd");
 S=[];W=null;sx=null;B={x:0,y:0};$("cal").style.display="block";
 for(var i=0;i<pos.length;i++){cd.style.left=pos[i][0]*100+"%";cd.style.top=pos[i][1]*100+"%";$("cp").textContent=(i+1)+" / "+pos.length;
  collecting=null;await sleep(1000);collecting=pos[i];await sleep(1300)}
 collecting=null;$("cal").style.display="none";
 if(S.length>120){try{W=fit(S);msg.textContent="کالیبراسیون انجام شد ✔ (خطا ≈ "+Math.round(rmsPx)+" پیکسل). اگر نقطه جابه‌جا بود «تصحیح سریع» را بزنید."}catch(e){msg.textContent="کالیبراسیون ناموفق بود؛ دوباره تلاش کنید"}}
 else msg.textContent="چهره کم دیده شد؛ نور را بهتر کنید و دوباره کالیبره کنید"}
async function quick(){
 if(!W){msg.textContent="ابتدا کالیبراسیون کامل را انجام دهید";return}
 var cd=$("cd");$("cp").textContent="تصحیح";cd.style.left="50%";cd.style.top="50%";$("cal").style.display="block";
 QS=[];collecting=null;await sleep(1000);collecting={q:1};await sleep(1600);collecting=null;$("cal").style.display="none";
 if(QS.length>10){var mx=0,my=0;QS.forEach(function(q){mx+=q[0];my+=q[1]});B={x:mx/QS.length-.5,y:my/QS.length-.5};sx=null;msg.textContent="تصحیح انجام شد ✔"}
 else msg.textContent="چهره دیده نشد؛ دوباره تلاش کنید"}
$("bStart").onclick=function(){mode="gaze";$("mode").value="gaze";start()};
$("bCal").onclick=calibrate;$("bQ").onclick=quick;
var ori=innerWidth>innerHeight;addEventListener("resize",function(){if((innerWidth>innerHeight)!==ori){ori=!ori;if(W){W=null;sx=null;msg.textContent="جهت صفحه عوض شد؛ دوباره کالیبره کنید"}}});
$("mode").onchange=function(e){mode=e.target.value;cur=-1;paint(0);dot.style.display="none";
 if(mode==="gaze")start();
 if(mode==="scan"){scanT=0;$("info").textContent="اسکن: گزینه‌ها یکی‌یکی روشن می‌شوند؛ مراقب یا کلید/سوییچ، روی گزینهٔ روشن کلیک یا Space بزند."}};
document.addEventListener("keydown",function(e){if(mode==="scan"&&(e.code==="Space"||e.code==="Enter")){e.preventDefault();choose(scanI)}});
$("dw").oninput=function(e){dwell=+e.target.value;$("dwv").textContent=e.target.value};
$("bTh").onclick=function(){var r=document.documentElement;r.setAttribute("data-theme",r.getAttribute("data-theme")==="dark"?"light":"dark")};
try{speechSynthesis.getVoices()}catch(e){}
</script>
</body>
</html>
